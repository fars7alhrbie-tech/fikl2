if(k==0){const p=[10,20,25,40,50,15,30][R(0,6)],n=R(2,40)*20;a=p*n/100;q=`كم يساوي ${p}% من ${n}؟`;e=`${p}% من ${n} = ${p}/100 × ${n} = ${a}.`}
else if(k==1){const x=R(2,15),m=R(2,9),b=R(1,20);a=x;q=`إذا كان ${m}س + ${b} = ${m*x+b}، فما قيمة س؟`;e=`نطرح ${b} من الطرفين: ${m}س = ${m*x}، ثم نقسم على ${m} فيكون س = ${x}.`}
else if(k==2){const v=[R(5,30),R(5,30),R(5,30),R(5,30)];let s=v.reduce((x,y)=>x+y);const f=(4-s%4)%4;v[3]+=f;s+=f;a=s/4;q=`ما متوسط الأعداد: ${v.join('، ')}؟`;e=`المتوسط = المجموع ÷ العدد = ${s} ÷ 4 = ${a}.`}
else if(k==3){const sp=R(4,15)*10,t=R(2,6);a=sp*t;q=`سيارة سرعتها ${sp} كم/س، كم تقطع من المسافة في ${t} ساعات؟`;e=`المسافة = السرعة × الزمن = ${sp} × ${t} = ${a} كم.`}
else if(k==4){const x=R(2,5),y=R(2,5),u=R(3,12);const tot=(x+y)*u;a=x*u;q=`قُسّم مبلغ ${tot} ريال بين شخصين بنسبة ${x}:${y}، كم نصيب الأول؟`;e=`مجموع الأجزاء ${x+y}، قيمة الجزء ${tot} ÷ ${x+y} = ${u}، نصيب الأول = ${x} × ${u} = ${a} ريال.`}
else if(k==5){const l=R(3,20),w=R(2,15);a=l*w;q=`ما مساحة مستطيل طوله ${l} وعرضه ${w}؟`;e=`المساحة = الطول × العرض = ${l} × ${w} = ${a}.`}
else if(k==6){const p=R(5,40)*10,d=[10,20,25,50][R(0,3)];a=p-p*d/100;q=`سعر سلعة ${p} ريال وعليها خصم ${d}%، كم سعرها بعد الخصم؟`;e=`الخصم = ${p*d/100}، السعر بعده = ${p} − ${p*d/100} = ${a} ريال.`}
else if(k==7){const s=R(1,9),d=R(2,9);a=s+4*d;q=`ما العدد التالي في المتتالية: ${s}، ${s+d}، ${s+2*d}، ${s+3*d}، ...؟`;e=`الفرق ثابت = ${d}، فالعدد التالي = ${s+3*d} + ${d} = ${a}.`}
else if(k==8){const n=R(2,9),m=R(1,9);a=n*m;q=`ما ناتج ${n} × ${m} + ${n}؟`;e=`${n} × ${m} = ${n*m}، ثم نضيف ${n} فيكون ${n*m+n}.`;a=n*m+n}
else{const s=R(3,25);a=4*s;q=`ما محيط مربع طول ضلعه ${s}؟`;e=`المحيط = 4 × طول الضلع = 4 × ${s} = ${a}.`}
const o=new Set([a]);let g=0;while(o.size<4&&g++<50){const d=R(1,6)*(r()<.5?-1:1)*(Math.abs(a)>20?R(1,3):1);if(a+d>=0&&Number.isInteger(a+d))o.add(a+d)}let z=a+1;while(o.size<4)o.add(z++);
const arr=[...o];for(let j=3;j>0;j--){const m=Math.floor(r()*(j+1));[arr[j],arr[m]]=[arr[m],arr[j]]}
return{q,o:arr.map(String),a:arr.indexOf(a),e,c}}

box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j==Q.a)x.classList.add('ok')});if(i!=Q.a)b.classList.add('no');
